# Copiá este archivo a config.yaml y completá tus propios criterios.
# config.yaml NO se sube al repo (está en .gitignore).

search:
  keywords:
    - "Desarrollador Backend"
    - "Data Analyst"
  # Usado solo para el filtro final por ubicación (matcher.py). La búsqueda
  # real por sitio se define abajo en cada entrada de `sites.*`.
  locations:
    - "Buenos Aires, Argentina"
    - "Remoto"
  remote_only: false
  salary_min: null
  # Descarta vacantes más viejas que esto (cuando el sitio muestra la fecha).
  # Si no se puede determinar la fecha, la vacante NO se descarta.
  max_days_old: 30
  exclude_keywords:
    - "pasantia"
    - "sin experiencia"
  max_results_per_site: 25

sites:
  indeed:
    enabled: true
    delay: 2.0
    domains:
      - domain: "ar.indeed.com"
        locations:
          - "Buenos Aires, Argentina"
          - "Remoto"

  linkedin:
    enabled: true
    delay: 3.0
    locations:
      - "Buenos Aires, Argentina"
      - "Remote"

  zonajobs:
    enabled: true
    base_url: "https://www.zonajobs.com.ar"
    delay: 3.0
    locations:
      - "Buenos Aires, Argentina"
      - "Remoto"

notification:
  output_dir: "data/reports"

cover_letter:
  enabled: true
  cv_path: "cv/cv.txt"
  anthropic_model: "claude-sonnet-5"

db:
  path: "data/jobs.sqlite3"
